name: beesky-cloud-next
services:
  db:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_DB: beesky
      POSTGRES_USER: beesky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run dev_setup.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beesky -d beesky"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8026:8025"
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: cloud_service/Dockerfile
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput --verbosity 0 && exec gunicorn beesky_cloud.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 30 --access-logfile -"]
    ports:
      - "127.0.0.1:8793:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: cloud_service/Dockerfile
    env_file: .env
    command: ["python", "manage.py", "cloud_worker"]
    depends_on:
      web:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
volumes:
  cloud-postgres:
