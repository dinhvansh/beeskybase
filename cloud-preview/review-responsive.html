<!doctype html><html><head><meta charset="utf-8"><title>BeeSky responsive review</title><style>body{margin:0;background:#cbd0d8}iframe{display:block;border:0;background:white}form{padding:8px;display:flex;gap:8px;font:13px system-ui}</style></head><body><form><label>Width <input name="width" type="number" value="390"></label><label>Route <input name="route" value="overview"></label><button>View</button></form><output id="measure" style="display:block;font:12px monospace;background:white;padding:8px"></output><iframe title="BeeSky responsive preview"></iframe><script>const p=new URLSearchParams(location.search),width=Math.max(320,Math.min(1920,Number(p.get('width'))||390)),route=p.get('route')||'overview';document.querySelector('[name=width]').value=width;document.querySelector('[name=route]').value=route;const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.style.height='844px';frame.addEventListener('load',()=>{requestAnimationFrame(()=>{const d=frame.contentDocument.documentElement;document.querySelector('#measure').textContent=JSON.stringify({width:frame.contentWindow.innerWidth,scrollWidth:d.scrollWidth,overflow:d.scrollWidth>frame.contentWindow.innerWidth,route:frame.contentWindow.location.hash})})});frame.src='./#/'+encodeURIComponent(route);</script></body></html>
