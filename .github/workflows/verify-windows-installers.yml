name: Verify published Windows installers
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published version to verify'
        required: true
        default: 'v0.44.1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published installers and verify digests
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid release tag' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" -Headers $headers
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = $env:RELEASE_TAG.Substring(1)
          foreach ($name in @("BeeSkySetup-$version.exe", "BeeSkyAgentSetup-$version.exe")) {
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "Missing asset $name" }
            $file = Join-Path (Get-Location) "dist/$name"
            Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $file
            if ((Get-Item $file).Length -ne $asset.size) { throw "Size mismatch $name" }
            if ($asset.digest -and $asset.digest -ne ('sha256:' + (Get-FileHash $file -Algorithm SHA256).Hash.ToLower())) { throw "Digest mismatch $name" }
          }
      - name: Verify preservation and uninstall while Agent is running
        shell: powershell
        run: tools/verify_windows_installers.ps1
