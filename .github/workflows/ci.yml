# BeeSky CI — runs on every push to main and every pull request.
#
# What this does today: verifies the v0.1 LAN scanner still works by
# running the mock-miner end-to-end test (fake S19 Pro: board 2 missing
# 3 chips, board 3 at 88 C). No deployment step yet — v0.1 is a CLI that
# scans the workshop LAN, so there is no server to deploy to a VPS.
# When a server component lands (Pulse-style agent / fee server), its
# deploy job goes in this same file, behind this test job.
name: BeeSky CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI smoke check
        run: python -m beesky --help
      - name: Mock-miner end-to-end test
        run: bash tests/run_mock_test.sh
