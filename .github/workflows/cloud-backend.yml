name: Cloud backend
on:
  push:
    paths: ['cloud_service/**', '.github/workflows/cloud-backend.yml']
  pull_request:
    paths: ['cloud_service/**', '.github/workflows/cloud-backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beesky
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: beesky
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beesky"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BEESKY_TESTING: '1'
      DATABASE_URL: postgresql://beesky:isolated-ci-only@127.0.0.1:5432/beesky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud_service/requirements.lock
      - run: pip install -r cloud_service/requirements.lock
      - run: python cloud_service/manage.py makemigrations --check --dry-run
      - run: python cloud_service/manage.py check
      - run: python cloud_service/manage.py test core.tests --noinput
