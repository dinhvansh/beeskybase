# BeeSky Windows build — produces the user-facing installer.
#
# BeeSky is developed/tested on Linux, but PyInstaller cannot
# cross-compile, so the Windows exe is built here on a windows-latest
# runner:
#
#   python source --PyInstaller--> dist\beesky.exe
#                 --Inno Setup---> dist\BeeSkySetup-<version>.exe
#
# Runs:
#   * manually (Actions tab -> "Build Windows installer" -> Run workflow)
#     -> download the "BeeSky-Windows" artifact from the run page.
#   * on every tag v* -> the same files are also attached to a GitHub
#     Release, which is the stable download link for users.
#
# The Ubuntu CI workflow (ci.yml) remains the correctness gate; the
# mock suite is re-run here under Git Bash as a smoke check only
# (non-blocking: loopback/bash quirks on the Windows runner must not
# block packaging — compileall + --help below are the hard gates).
#
# Code signing (optional, tag builds only): if the repo carries the
# ESIGNER_* secrets (SSL.com eSigner cloud signing), a tag build signs
# dist\beesky.exe AND dist\beesky-gui.exe BEFORE Inno Setup embeds
# them, then signs the installer — 3 signings per release, nothing
# more (eSigner tiers meter the number of signings, so
# manual/workflow_dispatch builds never sign). Without the secrets
# every step below behaves exactly as an unsigned build. Owner setup
# checklist: docs/signing.md.
#
# Update manifest (optional, tag builds only): if the repo carries
# the UPDATE_SIGNING_KEY secret (the owner's update-channel RSA
# private key), a tag build additionally writes
# dist\update-manifest.json over the FINAL dist files (i.e. after
# any eSigner signing, so the pinned hashes match what ships),
# signs it with openssl, and attaches manifest + signature to the
# Release — that pair is what `beesky update` verifies before
# self-updating (docs/updating.md). No secret -> releases are
# byte-identical to before.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach files to the Release on tags

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Signing is opt-in via repo secrets (set up once by the owner —
      # docs/signing.md). Secrets cannot be read in `if:` conditions,
      # so this probe maps the one fact later steps need into an
      # output. It never fails the build.
      - name: Check code signing configuration
        id: signcheck
        shell: bash
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
        run: |
          if [ -n "$ESIGNER_USERNAME" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "eSigner secrets found - tag builds will be code-signed."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No eSigner secrets - builds stay unsigned (docs/signing.md)."
          fi

      # Same probe pattern for the self-update manifest: the key's
      # presence is the only fact later steps may know (the key
      # itself is materialised only inside the signing step).
      - name: Check update signing configuration
        id: updatecheck
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "has_update_key=true" >> "$GITHUB_OUTPUT"
            echo "UPDATE_SIGNING_KEY found - tag builds will sign update-manifest.json."
          else
            echo "has_update_key=false" >> "$GITHUB_OUTPUT"
            echo "No UPDATE_SIGNING_KEY - releases ship without an update manifest (docs/updating.md)."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke checks (source)
        run: |
          python -m compileall beesky
          python -m beesky --help

      - name: Mock test suite (Git Bash, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          # The scripts call `python3`; give them a shim to the
          # runner's `python` (Git Bash has no python3.exe).
          mkdir -p .shim
          printf '#!/bin/sh\nexec python "$@"\n' > .shim/python3
          chmod +x .shim/python3
          export PATH="$PWD/.shim:$PATH"
          bash tests/run_mock_test.sh
          bash tests/run_mock_test_v2.sh

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exes (console CLI + windowed GUI + agent app, single file each)
        run: pyinstaller packaging/beesky.spec --noconfirm

      - name: Smoke check (frozen exe)
        run: .\dist\beesky.exe --help

      # `gui --help` is parsed by argparse and exits before any
      # window opens — a safe headless smoke for the windowed build.
      - name: Smoke check (frozen GUI exe)
        run: .\dist\beesky-gui.exe --help

      # `--help` prints the agent app's usage and exits before any
      # window opens — same headless smoke trick as the GUI exe.
      - name: Smoke check (frozen agent exe)
        run: .\dist\beesky-agent.exe --help

      # Sign the exe BEFORE Inno Setup runs: the installer embeds
      # dist\beesky.exe, so it must already carry its signature.
      # Tag builds only (see header note on signing quota).
      - name: Sign beesky.exe (SSL.com eSigner)
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          input_file_path: ${{ github.workspace }}\dist\beesky.exe
          output_file_path: ${{ github.workspace }}\signed
          override: true

      - name: Use signed beesky.exe
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # With override, CodeSignTool normally replaces the input
          # file in place; if the signed copy landed in the output
          # dir instead, swap it in — either way Inno Setup below
          # embeds the signed dist\beesky.exe.
          if (Test-Path signed\beesky.exe) {
            Copy-Item signed\beesky.exe dist\beesky.exe -Force
          }
          if (-not (Test-Path dist\beesky.exe)) { exit 1 }

      - name: Sign beesky-gui.exe (SSL.com eSigner)
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          input_file_path: ${{ github.workspace }}\dist\beesky-gui.exe
          output_file_path: ${{ github.workspace }}\signed
          override: true

      - name: Use signed beesky-gui.exe
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Same convergence as the CLI exe step above.
          if (Test-Path signed\beesky-gui.exe) {
            Copy-Item signed\beesky-gui.exe dist\beesky-gui.exe -Force
          }
          if (-not (Test-Path dist\beesky-gui.exe)) { exit 1 }

      - name: Build installers (Inno Setup)
        shell: powershell
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The standalone agent installer (v0.14) — same dist dir,
          # distinct OutputBaseFilename (BeeSkyAgentSetup-<ver>.exe),
          # so the BeeSkySetup-* globs elsewhere never match it.
          & $iscc packaging\agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The signer needs one concrete path, but the installer name
      # carries the version (BeeSkySetup-<version>.exe) — resolve it.
      - name: Locate installer for signing
        id: installerpath
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $f = Get-ChildItem dist\BeeSkySetup-*.exe | Select-Object -First 1
          if (-not $f) { Write-Error "No BeeSkySetup-*.exe found in dist"; exit 1 }
          "path=$($f.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($f.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign installer (SSL.com eSigner)
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          input_file_path: ${{ steps.installerpath.outputs.path }}
          output_file_path: ${{ github.workspace }}\signed
          override: true

      - name: Use signed installer
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Same convergence as the exe step: if the signed installer
          # is in the output dir, swap it over the unsigned one so the
          # artifact/Release steps below pick up the signed file.
          $signedFile = Join-Path signed "${{ steps.installerpath.outputs.name }}"
          if (Test-Path $signedFile) {
            Copy-Item $signedFile "${{ steps.installerpath.outputs.path }}" -Force
          }

      # Report-only: a signature quirk must never kill a release.
      - name: Verify signatures (non-blocking)
        if: steps.signcheck.outputs.has_signing == 'true' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: powershell
        run: |
          $files = @((Resolve-Path dist\beesky.exe).Path,
                     (Resolve-Path dist\beesky-gui.exe).Path)
          $files += Get-ChildItem dist\BeeSkySetup-*.exe | ForEach-Object { $_.FullName }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)"
            if ($sig.SignerCertificate) {
              Write-Host "    signer: $($sig.SignerCertificate.Subject)"
            }
            if ($sig.TimeStamperCertificate) {
              Write-Host "    timestamp: $($sig.TimeStamperCertificate.Subject)"
            }
          }

      # Runs AFTER all (optional) eSigner signing above, so the
      # manifest's SHA-256 pins cover the exact files that ship.
      # Tag builds only, and only when the owner configured the
      # UPDATE_SIGNING_KEY secret — otherwise this whole update
      # channel stays off and the release is unchanged.
      - name: Build + sign update manifest (tags, key configured)
        if: steps.updatecheck.outputs.has_update_key == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          openssl version
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          INSTALLER="$(basename "$(ls dist/BeeSkySetup-*.exe | head -n 1)")"
          AGENT_INSTALLER="$(basename "$(ls dist/BeeSkyAgentSetup-*.exe | head -n 1)")"
          python - "$VER" "$BASE" "$PUBLISHED" "$INSTALLER" "$AGENT_INSTALLER" <<'PYEOF'
          import hashlib, json, sys
          from pathlib import Path
          version, base, published, installer, agent_installer = sys.argv[1:6]
          files = []
          # beesky-agent.exe is listed so a running agent app matches
          # the manifest entry by its own exe name and self-updates
          # through this same signed channel (v0.14).
          for name in ["beesky.exe", "beesky-gui.exe", "beesky-agent.exe",
                       installer, agent_installer]:
              data = (Path("dist") / name).read_bytes()
              files.append({"name": name, "url": f"{base}/{name}",
                            "sha256": hashlib.sha256(data).hexdigest(),
                            "size": len(data)})
          manifest = {"version": version, "published_at": published,
                      "files": files}
          Path("dist/update-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PYEOF
          KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY_FILE"
          openssl dgst -sha256 -sign "$KEY_FILE" \
            -out dist/update-manifest.sig dist/update-manifest.json
          # Self-check with the matching public key before shipping,
          # then the private key material leaves the runner.
          openssl pkey -in "$KEY_FILE" -pubout -out "$RUNNER_TEMP/update-pub.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update-pub.pem" \
            -signature dist/update-manifest.sig dist/update-manifest.json
          rm -f "$KEY_FILE" "$RUNNER_TEMP/update-pub.pem"
          ls -l dist/update-manifest.json dist/update-manifest.sig

      - name: Upload artifact (installers + bare exes)
        uses: actions/upload-artifact@v4
        with:
          name: BeeSky-Windows
          path: |
            dist/BeeSkySetup-*.exe
            dist/BeeSkyAgentSetup-*.exe
            dist/beesky.exe
            dist/beesky-gui.exe
            dist/beesky-agent.exe
          if-no-files-found: error

      - name: Upload artifact (update manifest)
        if: steps.updatecheck.outputs.has_update_key == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: BeeSky-UpdateManifest
          path: |
            dist/update-manifest.json
            dist/update-manifest.sig
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BeeSkySetup-*.exe
            dist/BeeSkyAgentSetup-*.exe
            dist/beesky.exe
            dist/beesky-gui.exe
            dist/beesky-agent.exe
          fail_on_unmatched_files: true

      - name: Attach update manifest to GitHub Release (tags, key configured)
        if: steps.updatecheck.outputs.has_update_key == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/update-manifest.json
            dist/update-manifest.sig
          fail_on_unmatched_files: true
